[workspace]
resolver = "2"
members = [
    "common",
    "hw0",
    "hw1",
    "hw2",
    "hw3",
    "hw4",
    "hw5",
    "hw6",
    "hw7",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
candle-core = "0.11.1"
flate2 = "1.1.11"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq", "native-tls"] }
rand = "0.9"
regex = "1"
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiktoken-rs = "0.12.1"
ureq = "3.5.2"
common = { path = "common" }
